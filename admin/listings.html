<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Job Listings — Admin · Oz Indie Collective</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
</head>
<body>
<div id="nav-placeholder"></div>
<div class="admin-layout">
  <aside class="admin-sidebar">
    <div style="padding:1.25rem 1.5rem;border-bottom:1px solid var(--border);margin-bottom:.5rem">
      <div class="text-xs mono text-gold mb-1">Admin Panel</div>
      <div class="text-sm" style="color:var(--cream);font-weight:600">Oz Indie Collective</div>
    </div>
    <a href="index.html" class="admin-nav-item">Dashboard</a>
    <a href="applications.html" class="admin-nav-item">Applications <span class="admin-badge">7</span></a>
    <a href="members.html" class="admin-nav-item">Members</a>
    <a href="listings.html" class="admin-nav-item active">Job Listings <span class="admin-badge">3</span></a>
    <a href="articles.html" class="admin-nav-item">Articles</a>
    <a href="highlights.html" class="admin-nav-item">Highlights</a>
    <a href="partners.html" class="admin-nav-item">Partners</a>
    <a href="reports.html" class="admin-nav-item">Reports</a>
    <div style="margin-top:2rem;padding:1.25rem 1.5rem;border-top:1px solid var(--border)">
      <a href="#" data-action="logout" class="text-xs text-muted mono" style="text-decoration:none;text-transform:uppercase;letter-spacing:.08em">← Exit Admin</a>
    </div>
  </aside>
  <main class="admin-main">
    <div style="margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:1px solid var(--border)">
      <h1 style="font-family:var(--font-display);font-size:1.8rem;font-weight:700;color:var(--cream)">Job Listings</h1>
      <p class="text-muted text-sm mt-1">Review and moderate all job and project listings.</p>
    </div>

    <div style="display:flex;gap:.5rem;margin-bottom:1.5rem">
      <button onclick="window.__filterListings('pending',this)" class="btn-primary" id="lfBtn-pending" style="font-size:.62rem;padding:.4rem .9rem">Pending Review (…)</button>
      <button onclick="window.__filterListings('live',this)" class="btn-ghost" id="lfBtn-live" style="font-size:.62rem;padding:.4rem .9rem">Live (…)</button>
      <button onclick="window.__filterListings('denied',this)" class="btn-ghost" id="lfBtn-denied" style="font-size:.62rem;padding:.4rem .9rem">Denied (…)</button>
      <button onclick="window.__filterListings('all',this)" class="btn-ghost" id="lfBtn-all" style="font-size:.62rem;padding:.4rem .9rem">All (…)</button>
    </div>

    <div style="display:flex;flex-direction:column;gap:1rem" id="listingsContainer">
      <p class="text-muted text-sm">Loading listings…</p>
    </div>
  </main>
</div>
<script src="../assets/js/nav-inject.js?v=2"></script>
<script src="../assets/js/main.js?v=4"></script>
<script type="module">
import { getAllListings, approveListing, denyListing } from '../assets/js/supabase.js?v=2';

let listings = [];
let currentFilter = 'pending';

function timeAgo(iso){
  if(!iso) return '';
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diffMs/60000);
  if(mins < 60) return mins+'m ago';
  const hrs = Math.floor(mins/60);
  if(hrs < 24) return hrs+'h ago';
  return Math.floor(hrs/24)+'d ago';
}

function renderRow(listing){
  const e = escapeHtml;
  const statusTag = listing.status==='live' ? 'tag-approved' : listing.status==='denied' ? 'tag-denied' : 'tag-pending';
  const statusLabel = listing.status.charAt(0).toUpperCase()+listing.status.slice(1);
  const disabled = listing.status !== 'pending';
  const poster = listing.profiles?.full_name || '(unknown)';
  return `
  <div style="background:rgba(245,166,35,.04);border:1px solid rgba(245,166,35,.2);border-radius:4px;padding:1.5rem">
    <div class="flex justify-between items-start mb-2">
      <div>
        <div class="flex gap-2 mb-1"><span class="tag ${statusTag}">${statusLabel}</span><span class="tag tag-gold">${e(listing.employment_type||'—')}</span><span class="tag tag-blue">${e(listing.category||'—')}</span></div>
        <h3 style="font-family:var(--font-display);font-size:1.1rem;color:var(--cream);margin-bottom:.2rem">${e(listing.title||'(untitled)')}</h3>
        <div class="text-sm text-muted">Posted by ${e(poster)} · ${e([listing.city,listing.state].filter(Boolean).join(', ')||'—')} · Submitted ${timeAgo(listing.created_at)}</div>
      </div>
      <div class="flex gap-1">
        <button class="btn-success" ${disabled?'disabled':''} data-listing-action="approve" data-listing-id="${e(listing.id)}">✓ Approve</button>
        <button class="btn-danger" ${disabled?'disabled':''} data-listing-action="deny" data-listing-id="${e(listing.id)}">✗ Deny</button>
      </div>
    </div>
    <div style="background:rgba(240,237,230,.03);border:1px solid var(--border);border-radius:3px;padding:1rem">
      <p class="text-sm text-muted" style="line-height:1.6">${e(listing.description||'')}</p>
    </div>
    <div class="flex gap-3 mt-2 text-xs text-muted">
      <span>💰 ${e(listing.pay||'—')}</span>
      <span>📍 ${e([listing.city,listing.state].filter(Boolean).join(', ')||'—')}</span>
    </div>
  </div>`;
}

function renderAll(){
  const list = currentFilter==='all' ? listings : listings.filter(l=>l.status===currentFilter);
  document.getElementById('listingsContainer').innerHTML = list.length
    ? list.map(renderRow).join('')
    : '<p class="text-muted text-sm">No listings in this category.</p>';

  document.getElementById('lfBtn-pending').textContent = `Pending Review (${listings.filter(l=>l.status==='pending').length})`;
  document.getElementById('lfBtn-live').textContent = `Live (${listings.filter(l=>l.status==='live').length})`;
  document.getElementById('lfBtn-denied').textContent = `Denied (${listings.filter(l=>l.status==='denied').length})`;
  document.getElementById('lfBtn-all').textContent = `All (${listings.length})`;
}

window.__filterListings = function(status, btn){
  currentFilter = status;
  document.querySelectorAll('[id^="lfBtn-"]').forEach(b=>b.className='btn-ghost');
  btn.className = 'btn-primary';
  renderAll();
};

window.__listingApprove = async function(id){
  try{ await approveListing(id); const l=listings.find(x=>x.id===id); if(l)l.status='live'; showToast('Listing approved and now live!','success'); renderAll(); }
  catch(err){ showToast(err.message||'Failed to approve listing.','danger'); }
};
window.__listingDeny = async function(id){
  try{ await denyListing(id); const l=listings.find(x=>x.id===id); if(l)l.status='denied'; showToast('Listing denied.','danger'); renderAll(); }
  catch(err){ showToast(err.message||'Failed to deny listing.','danger'); }
};

document.getElementById('listingsContainer').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-listing-action]');
  if (!btn) return;
  if (btn.dataset.listingAction === 'approve') window.__listingApprove(btn.dataset.listingId);
  else window.__listingDeny(btn.dataset.listingId);
});

async function load(){
  try{
    listings = await getAllListings();
    renderAll();
  }catch(err){
    document.getElementById('listingsContainer').innerHTML = `<p class="text-muted text-sm">Failed to load listings: ${err.message}</p>`;
  }
}

document.addEventListener('DOMContentLoaded', () => {
  if(!Auth.get()?.isAdmin) { window.location.href='../pages/login.html'; return; }
  load();
});
</script>
</body>
</html>
