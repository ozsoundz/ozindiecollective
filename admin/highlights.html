<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Highlights — Admin · Oz Indie Collective</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
</head>
<body>
<div id="nav-placeholder"></div>
<div class="admin-layout">
  <aside class="admin-sidebar">
    <div style="padding:1.25rem 1.5rem;border-bottom:1px solid var(--border);margin-bottom:.5rem">
      <div class="text-xs mono text-gold mb-1">Admin Panel</div>
      <div class="text-sm" style="color:var(--cream);font-weight:600">Oz Indie Collective</div>
    </div>
    <a href="index.html" class="admin-nav-item">Dashboard</a>
    <a href="applications.html" class="admin-nav-item">Applications <span class="admin-badge" id="navPendingBadge">…</span></a>
    <a href="members.html" class="admin-nav-item">Members</a>
    <a href="listings.html" class="admin-nav-item">Job Listings</a>
    <a href="projects.html" class="admin-nav-item">Projects</a>
    <a href="articles.html" class="admin-nav-item">Articles</a>
    <a href="highlights.html" class="admin-nav-item active">Highlights</a>
    <a href="partners.html" class="admin-nav-item">Partners</a>
    <a href="community.html" class="admin-nav-item">Community</a>
    <a href="reports.html" class="admin-nav-item">Reports</a>
    <div style="margin-top:2rem;padding:1.25rem 1.5rem;border-top:1px solid var(--border)">
      <a href="#" data-action="logout" class="text-xs text-muted mono" style="text-decoration:none;text-transform:uppercase;letter-spacing:.08em">← Exit Admin</a>
    </div>
  </aside>
  <main class="admin-main">
    <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:1px solid var(--border)">
      <div>
        <h1 style="font-family:var(--font-display);font-size:1.8rem;font-weight:700;color:var(--cream)">Professional Highlights</h1>
        <p class="text-muted text-sm mt-1">Curate the video showcase featured on the public site.</p>
      </div>
      <button class="btn-primary" onclick="window.__openEditor()">+ New Highlight</button>
    </div>

    <div style="display:flex;flex-direction:column;gap:1rem" id="highlightsContainer">
      <p class="text-muted text-sm">Loading highlights…</p>
    </div>
  </main>
</div>

<div id="highlightModal" style="display:none;position:fixed;inset:0;background:rgba(10,10,12,.75);z-index:100;align-items:center;justify-content:center;padding:2rem">
  <div style="background:var(--deep);border:1px solid var(--border-hi);border-radius:6px;max-width:640px;width:100%;max-height:90vh;overflow-y:auto;padding:2rem">
    <h2 style="font-family:var(--font-display);color:var(--cream);font-size:1.3rem;margin-bottom:1.25rem" id="highlightModalTitle">New Highlight</h2>
    <form id="highlightForm" style="display:flex;flex-direction:column;gap:1rem">
      <input type="hidden" id="hf_id">
      <div>
        <label class="text-xs text-muted mono">Title</label>
        <input type="text" id="hf_title" class="input" required>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
        <div>
          <label class="text-xs text-muted mono">Member Name</label>
          <input type="text" id="hf_member" class="input">
        </div>
        <div>
          <label class="text-xs text-muted mono">Category</label>
          <input type="text" id="hf_category" class="input" placeholder="e.g. Live Performance">
        </div>
      </div>
      <div>
        <label class="text-xs text-muted mono">Video URL (YouTube/Vimeo embed link)</label>
        <input type="text" id="hf_video" class="input" placeholder="https://www.youtube.com/embed/...">
      </div>
      <div>
        <label class="text-xs text-muted mono">Thumbnail</label>
        <div style="display:flex;gap:.5rem;align-items:center">
          <input type="text" id="hf_thumb" class="input" placeholder="https://picsum.photos/seed/oic-vid1/640/360" style="flex:1">
          <input type="file" id="hf_thumb_file" accept="image/*" style="display:none">
          <button type="button" class="btn-ghost" style="font-size:.62rem;white-space:nowrap" onclick="document.getElementById('hf_thumb_file').click()">Upload</button>
        </div>
        <div class="text-xs text-muted mt-1" id="hf_thumb_status"></div>
      </div>
      <div>
        <label class="text-xs text-muted mono">Description</label>
        <textarea id="hf_description" class="input" rows="3"></textarea>
      </div>
      <div>
        <label class="text-xs text-muted mono">Status</label>
        <select id="hf_status" class="input">
          <option value="draft">Draft</option>
          <option value="published">Published</option>
        </select>
      </div>
      <div style="display:flex;gap:.75rem;margin-top:.5rem">
        <button type="submit" class="btn-primary">Save Highlight</button>
        <button type="button" class="btn-ghost" onclick="window.__closeEditor()">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script src="../assets/js/nav-inject.js?v=2"></script>
<script src="../assets/js/main.js?v=4"></script>
<script type="module">
import { getAllHighlights, createHighlight, updateHighlight, deleteHighlight, uploadAdminMedia } from '../assets/js/supabase.js?v=2';

document.getElementById('hf_thumb_file').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const statusEl = document.getElementById('hf_thumb_status');
  statusEl.textContent = 'Uploading…';
  try {
    const url = await uploadAdminMedia('highlight-thumbs', file);
    document.getElementById('hf_thumb').value = url;
    statusEl.textContent = 'Uploaded ✓';
  } catch(err) {
    statusEl.textContent = 'Upload failed: ' + (err.message || 'unknown error');
  }
});

let highlights = [];

function renderRow(h){
  const e = escapeHtml;
  const statusTag = h.status==='published' ? 'tag-approved' : 'tag-pending';
  const statusLabel = h.status.charAt(0).toUpperCase()+h.status.slice(1);
  return `
  <div style="background:rgba(245,166,35,.04);border:1px solid var(--border);border-radius:4px;padding:1.5rem;display:flex;justify-content:space-between;gap:1rem;align-items:flex-start">
    <div>
      <div class="flex gap-2 mb-1"><span class="tag ${statusTag}">${statusLabel}</span>${h.category?`<span class="tag tag-blue">${e(h.category)}</span>`:''}</div>
      <h3 style="font-family:var(--font-display);font-size:1.1rem;color:var(--cream);margin-bottom:.2rem">${e(h.title||'(untitled)')}</h3>
      <div class="text-sm text-muted">${e(h.member_name||'—')}</div>
    </div>
    <div class="flex gap-1" style="flex-shrink:0">
      <button class="btn-ghost" style="font-size:.62rem" data-highlight-action="edit" data-highlight-id="${e(h.id)}">Edit</button>
      <button class="btn-danger" style="font-size:.62rem" data-highlight-action="delete" data-highlight-id="${e(h.id)}">Delete</button>
    </div>
  </div>`;
}

function renderAll(){
  document.getElementById('highlightsContainer').innerHTML = highlights.length
    ? highlights.map(renderRow).join('')
    : '<p class="text-muted text-sm">No highlights yet. Click "+ New Highlight" to add one.</p>';
}

window.__openEditor = function(){
  document.getElementById('highlightModalTitle').textContent = 'New Highlight';
  document.getElementById('highlightForm').reset();
  document.getElementById('hf_id').value = '';
  document.getElementById('highlightModal').style.display = 'flex';
};

window.__editHighlight = function(id){
  const h = highlights.find(x=>x.id===id);
  if(!h) return;
  document.getElementById('highlightModalTitle').textContent = 'Edit Highlight';
  document.getElementById('hf_id').value = h.id;
  document.getElementById('hf_title').value = h.title||'';
  document.getElementById('hf_member').value = h.member_name||'';
  document.getElementById('hf_category').value = h.category||'';
  document.getElementById('hf_video').value = h.video_url||'';
  document.getElementById('hf_thumb').value = h.thumbnail_url||'';
  document.getElementById('hf_description').value = h.description||'';
  document.getElementById('hf_status').value = h.status||'draft';
  document.getElementById('highlightModal').style.display = 'flex';
};

window.__closeEditor = function(){
  document.getElementById('highlightModal').style.display = 'none';
};

document.getElementById('highlightsContainer').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-highlight-action]');
  if (!btn) return;
  if (btn.dataset.highlightAction === 'edit') window.__editHighlight(btn.dataset.highlightId);
  else window.__deleteHighlight(btn.dataset.highlightId);
});

window.__deleteHighlight = async function(id){
  if(!confirm('Delete this highlight permanently?')) return;
  try{
    await deleteHighlight(id);
    highlights = highlights.filter(h=>h.id!==id);
    renderAll();
    showToast('Highlight deleted.','info');
  }catch(err){ showToast(err.message||'Failed to delete highlight.','danger'); }
};

document.getElementById('highlightForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const id = document.getElementById('hf_id').value;
  const payload = {
    title: document.getElementById('hf_title').value,
    member_name: document.getElementById('hf_member').value,
    category: document.getElementById('hf_category').value,
    video_url: document.getElementById('hf_video').value,
    thumbnail_url: document.getElementById('hf_thumb').value,
    description: document.getElementById('hf_description').value,
    status: document.getElementById('hf_status').value
  };
  try{
    if(id){
      const [updated] = await updateHighlight(id, payload);
      const idx = highlights.findIndex(h=>h.id===id);
      if(idx>-1) highlights[idx] = updated;
      showToast('Highlight updated.','success');
    }else{
      const [created] = await createHighlight(payload);
      highlights.unshift(created);
      showToast('Highlight created.','success');
    }
    renderAll();
    window.__closeEditor();
  }catch(err){ showToast(err.message||'Failed to save highlight.','danger'); }
});

async function load(){
  try{
    highlights = await getAllHighlights();
    renderAll();
  }catch(err){
    document.getElementById('highlightsContainer').innerHTML = `<p class="text-muted text-sm">Failed to load highlights: ${err.message}</p>`;
  }
}

document.addEventListener('DOMContentLoaded', () => {
  if(!Auth.get()?.isAdmin) { window.location.href='../pages/login.html'; return; }
  load();
});
</script>
</body>
</html>
