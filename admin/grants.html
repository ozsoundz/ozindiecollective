<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grants — Admin · Oz Indie Collective</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
</head>
<body>
<div id="nav-placeholder"></div>
<div class="admin-layout">
  <aside class="admin-sidebar">
    <div style="padding:1.25rem 1.5rem;border-bottom:1px solid var(--border);margin-bottom:.5rem">
      <div class="text-xs mono text-gold mb-1">Admin Panel</div>
      <div class="text-sm" style="color:var(--cream);font-weight:600">Oz Indie Collective</div>
    </div>
    <a href="index.html" class="admin-nav-item">Dashboard</a>
    <a href="applications.html" class="admin-nav-item">Applications <span class="admin-badge" id="navPendingBadge">…</span></a>
    <a href="members.html" class="admin-nav-item">Members</a>
    <a href="listings.html" class="admin-nav-item">Job Listings</a>
    <a href="projects.html" class="admin-nav-item">Projects</a>
    <a href="articles.html" class="admin-nav-item">Articles</a>
    <a href="knowledge.html" class="admin-nav-item">Knowledge</a>
    <a href="grants.html" class="admin-nav-item active">Grants</a>
    <a href="templates.html" class="admin-nav-item">Templates</a>
    <a href="highlights.html" class="admin-nav-item">Highlights</a>
    <a href="partners.html" class="admin-nav-item">Partners</a>
    <a href="community.html" class="admin-nav-item">Community</a>
    <a href="events.html" class="admin-nav-item">Events</a>
    <a href="newsletter.html" class="admin-nav-item">Newsletter</a>
    <a href="reports.html" class="admin-nav-item">Reports</a>
    <div style="margin-top:2rem;padding:1.25rem 1.5rem;border-top:1px solid var(--border)">
      <a href="#" data-action="logout" class="text-xs text-muted mono" style="text-decoration:none;text-transform:uppercase;letter-spacing:.08em">← Exit Admin</a>
    </div>
  </aside>
  <main class="admin-main">
    <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:1px solid var(--border)">
      <div>
        <h1 style="font-family:var(--font-display);font-size:1.8rem;font-weight:700;color:var(--cream)">Grants Database</h1>
        <p class="text-muted text-sm mt-1">Manage the active grants list shown on the Resources page.</p>
      </div>
      <button class="btn-primary" onclick="window.__openEditor()">+ New Grant</button>
    </div>

    <div style="display:flex;flex-direction:column;gap:1rem" id="grantsContainer">
      <p class="text-muted text-sm">Loading grants…</p>
    </div>
  </main>
</div>

<div id="grantModal" style="display:none;position:fixed;inset:0;background:rgba(10,10,12,.75);z-index:100;align-items:center;justify-content:center;padding:2rem">
  <div style="background:var(--deep);border:1px solid var(--border-hi);border-radius:6px;max-width:640px;width:100%;max-height:90vh;overflow-y:auto;padding:2rem">
    <h2 style="font-family:var(--font-display);color:var(--cream);font-size:1.3rem;margin-bottom:1.25rem" id="grantModalTitle">New Grant</h2>
    <form id="grantForm" style="display:flex;flex-direction:column;gap:1rem">
      <input type="hidden" id="gf_id">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
        <div>
          <label class="text-xs text-muted mono">Funding Body</label>
          <input type="text" id="gf_org" class="input" placeholder="e.g. Australia Council" required>
        </div>
        <div>
          <label class="text-xs text-muted mono">Grant Name</label>
          <input type="text" id="gf_name" class="input" placeholder="e.g. Quick Response Grants" required>
        </div>
      </div>
      <div>
        <label class="text-xs text-muted mono">Description</label>
        <textarea id="gf_description" class="input" rows="3" placeholder="What it's for, eligibility, amount range"></textarea>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
        <div>
          <label class="text-xs text-muted mono">Amount</label>
          <input type="text" id="gf_amount" class="input" placeholder="e.g. Up to $10,000">
        </div>
        <div>
          <label class="text-xs text-muted mono">Deadline Type</label>
          <select id="gf_deadline_type" class="input">
            <option value="rolling">Rolling / Ongoing</option>
            <option value="closing">Has a Closing Date</option>
          </select>
        </div>
      </div>
      <div>
        <label class="text-xs text-muted mono">Deadline Label <span style="text-transform:none;letter-spacing:0">(shown on the card)</span></label>
        <input type="text" id="gf_deadline_label" class="input" placeholder="e.g. Closes Aug 30, or Rolling deadline">
      </div>
      <div>
        <label class="text-xs text-muted mono">Application URL</label>
        <input type="url" id="gf_url" class="input" placeholder="https://...">
      </div>
      <div>
        <label class="text-xs text-muted mono">Status</label>
        <select id="gf_status" class="input">
          <option value="draft">Draft</option>
          <option value="published">Published</option>
        </select>
      </div>
      <div style="display:flex;gap:.75rem;margin-top:.5rem">
        <button type="submit" class="btn-primary">Save Grant</button>
        <button type="button" class="btn-ghost" onclick="window.__closeEditor()">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script src="../assets/js/nav-inject.js?v=3"></script>
<script src="../assets/js/main.js?v=4"></script>
<script type="module">
import { getAllGrants, createGrant, updateGrant, deleteGrant } from '../assets/js/supabase.js?v=5';

let grants = [];

function renderRow(g){
  const e = escapeHtml;
  const statusTag = g.status==='published' ? 'tag-approved' : 'tag-pending';
  const statusLabel = g.status.charAt(0).toUpperCase()+g.status.slice(1);
  const deadlineTag = g.deadline_type==='closing' ? 'tag-gold' : 'tag-sage';
  return `
  <div style="background:rgba(245,166,35,.04);border:1px solid var(--border);border-radius:4px;padding:1.5rem;display:flex;justify-content:space-between;gap:1rem;align-items:flex-start">
    <div>
      <div class="flex gap-2 mb-1"><span class="tag ${statusTag}">${statusLabel}</span>${g.deadline_label?`<span class="tag ${deadlineTag}">${e(g.deadline_label)}</span>`:''}</div>
      <h3 style="font-family:var(--font-display);font-size:1.1rem;color:var(--cream);margin-bottom:.2rem">${e(g.name||'(untitled)')}</h3>
      <div class="text-sm text-muted">${e(g.org||'—')}${g.amount?` · ${e(g.amount)}`:''}</div>
    </div>
    <div class="flex gap-1" style="flex-shrink:0">
      <button class="btn-ghost" style="font-size:.62rem" data-grant-action="edit" data-grant-id="${e(g.id)}">Edit</button>
      <button class="btn-danger" style="font-size:.62rem" data-grant-action="delete" data-grant-id="${e(g.id)}">Delete</button>
    </div>
  </div>`;
}

function renderAll(){
  document.getElementById('grantsContainer').innerHTML = grants.length
    ? grants.map(renderRow).join('')
    : '<p class="text-muted text-sm">No grants yet. Click "+ New Grant" to add one.</p>';
}

window.__openEditor = function(){
  document.getElementById('grantModalTitle').textContent = 'New Grant';
  document.getElementById('grantForm').reset();
  document.getElementById('gf_id').value = '';
  document.getElementById('grantModal').style.display = 'flex';
};

window.__editGrant = function(id){
  const g = grants.find(x=>x.id===id);
  if(!g) return;
  document.getElementById('grantModalTitle').textContent = 'Edit Grant';
  document.getElementById('gf_id').value = g.id;
  document.getElementById('gf_org').value = g.org||'';
  document.getElementById('gf_name').value = g.name||'';
  document.getElementById('gf_description').value = g.description||'';
  document.getElementById('gf_amount').value = g.amount||'';
  document.getElementById('gf_deadline_type').value = g.deadline_type||'rolling';
  document.getElementById('gf_deadline_label').value = g.deadline_label||'';
  document.getElementById('gf_url').value = g.url||'';
  document.getElementById('gf_status').value = g.status||'draft';
  document.getElementById('grantModal').style.display = 'flex';
};

window.__closeEditor = function(){
  document.getElementById('grantModal').style.display = 'none';
};

document.getElementById('grantsContainer').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-grant-action]');
  if (!btn) return;
  if (btn.dataset.grantAction === 'edit') window.__editGrant(btn.dataset.grantId);
  else window.__deleteGrant(btn.dataset.grantId);
});

window.__deleteGrant = async function(id){
  if(!confirm('Delete this grant permanently?')) return;
  try{
    await deleteGrant(id);
    grants = grants.filter(g=>g.id!==id);
    renderAll();
    showToast('Grant deleted.','info');
  }catch(err){ showToast(err.message||'Failed to delete grant.','danger'); }
};

document.getElementById('grantForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const id = document.getElementById('gf_id').value;
  const payload = {
    org: document.getElementById('gf_org').value,
    name: document.getElementById('gf_name').value,
    description: document.getElementById('gf_description').value,
    amount: document.getElementById('gf_amount').value,
    deadline_type: document.getElementById('gf_deadline_type').value,
    deadline_label: document.getElementById('gf_deadline_label').value,
    url: document.getElementById('gf_url').value,
    status: document.getElementById('gf_status').value
  };
  try{
    if(id){
      const [updated] = await updateGrant(id, payload);
      const idx = grants.findIndex(g=>g.id===id);
      if(idx>-1) grants[idx] = updated;
      showToast('Grant updated.','success');
    }else{
      const [created] = await createGrant(payload);
      grants.unshift(created);
      showToast('Grant created.','success');
    }
    renderAll();
    window.__closeEditor();
  }catch(err){ showToast(err.message||'Failed to save grant.','danger'); }
});

async function load(){
  try{
    grants = await getAllGrants();
    renderAll();
  }catch(err){
    document.getElementById('grantsContainer').innerHTML = `<p class="text-muted text-sm">Failed to load grants: ${err.message}</p>`;
  }
}

document.addEventListener('DOMContentLoaded', () => {
  if(!Auth.get()?.isAdmin) { window.location.href='../pages/login.html'; return; }
  load();
});
</script>
</body>
</html>
