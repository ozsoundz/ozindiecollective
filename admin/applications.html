<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Applications — Admin · Oz Indie Collective</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
</head>
<body>
<div id="nav-placeholder"></div>
<div class="admin-layout">
  <aside class="admin-sidebar">
    <div style="padding:1.25rem 1.5rem;border-bottom:1px solid var(--border);margin-bottom:.5rem">
      <div class="text-xs mono text-gold mb-1">Admin Panel</div>
      <div class="text-sm" style="color:var(--cream);font-weight:600">Oz Indie Collective</div>
    </div>
    <a href="index.html" class="admin-nav-item">Dashboard</a>
    <a href="applications.html" class="admin-nav-item active">Applications <span class="admin-badge" id="navPendingBadge">…</span></a>
    <a href="members.html" class="admin-nav-item">Members</a>
    <a href="listings.html" class="admin-nav-item">Job Listings <span class="admin-badge">3</span></a>
    <a href="reports.html" class="admin-nav-item">Reports</a>
    <div style="margin-top:2rem;padding:1.25rem 1.5rem;border-top:1px solid var(--border)">
      <a href="#" data-action="logout" class="text-xs text-muted mono" style="text-decoration:none;text-transform:uppercase;letter-spacing:.08em">← Exit Admin</a>
    </div>
  </aside>
  <main class="admin-main">
    <div style="margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:1px solid var(--border)">
      <h1 style="font-family:var(--font-display);font-size:1.8rem;font-weight:700;color:var(--cream)">Membership Applications</h1>
      <p class="text-muted text-sm mt-1">Review, approve or deny incoming membership applications.</p>
    </div>

    <!-- Filter tabs -->
    <div style="display:flex;gap:.5rem;margin-bottom:1.5rem">
      <button onclick="filterApps('all',this)" class="btn-primary" id="filterBtn-all" style="font-size:.62rem;padding:.4rem .9rem">All (…)</button>
      <button onclick="filterApps('pending',this)" class="btn-ghost" id="filterBtn-pending" style="font-size:.62rem;padding:.4rem .9rem">Pending (…)</button>
      <button onclick="filterApps('approved',this)" class="btn-ghost" id="filterBtn-approved" style="font-size:.62rem;padding:.4rem .9rem">Approved (…)</button>
      <button onclick="filterApps('denied',this)" class="btn-ghost" id="filterBtn-denied" style="font-size:.62rem;padding:.4rem .9rem">Denied (…)</button>
    </div>

    <div style="display:flex;flex-direction:column;gap:1rem" id="appCards">
      <p class="text-muted text-sm" id="appLoading">Loading applications…</p>
    </div>
  </main>
</div>
<script src="../assets/js/nav-inject.js"></script>
<script src="../assets/js/main.js"></script>
<script type="module">
import { getAllApplications, approveApplication, denyApplication } from '../assets/js/supabase.js';

let applications = [];
let currentFilter = 'pending';

function timeAgo(iso){
  if(!iso) return '';
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diffMs/60000);
  if(mins < 60) return mins+'m ago';
  const hrs = Math.floor(mins/60);
  if(hrs < 24) return hrs+'h ago';
  return Math.floor(hrs/24)+'d ago';
}

function initials(name=''){
  return name.split(' ').slice(0,2).map(w=>w[0]?.toUpperCase()||'').join('')||'?';
}

function renderCard(app){
  const statusTag = app.status==='approved' ? 'tag-approved' : app.status==='denied' ? 'tag-denied' : 'tag-pending';
  const statusLabel = app.status.charAt(0).toUpperCase()+app.status.slice(1);
  const disabled = app.status !== 'pending';
  return `
  <div class="app-card" data-status="${app.status}" data-id="${app.id}" style="background:rgba(240,237,230,.03);border:1px solid var(--border);border-radius:4px;padding:1.5rem">
    <div style="display:grid;grid-template-columns:1fr auto;gap:1rem;align-items:start">
      <div>
        <div class="flex items-center gap-2 mb-2">
          <div class="avatar avatar-sm av-gold">${initials(app.full_name)}</div>
          <div><div style="font-weight:600;color:var(--cream)">${app.full_name||'(no name)'}</div><div class="text-xs text-muted">${app.email||''} · Applied ${timeAgo(app.created_at)}</div></div>
          <span class="tag ${statusTag}" style="margin-left:.5rem">${statusLabel}</span>
          <span class="tag tag-gold" style="font-size:.55rem">${(app.plan||'free')} Plan</span>
        </div>
        <div class="grid-4 mb-2" style="gap:.75rem">
          <div><div class="text-xs mono text-gold mb-1">Role</div><div class="text-sm" style="color:var(--cream)">${app.role||'—'}</div></div>
          <div><div class="text-xs mono text-gold mb-1">Location</div><div class="text-sm" style="color:var(--cream)">${[app.city,app.state].filter(Boolean).join(', ')||'—'}</div></div>
          <div><div class="text-xs mono text-gold mb-1">Referral</div><div class="text-sm" style="color:var(--cream)">${app.referral_source||'—'}</div></div>
          <div><div class="text-xs mono text-gold mb-1">Skills</div><div class="text-sm" style="color:var(--cream)">${(app.skills||[]).join(', ')||'—'}</div></div>
        </div>
        <div style="background:rgba(240,237,230,.03);border:1px solid var(--border);border-radius:3px;padding:1rem;margin-bottom:.75rem">
          <div class="text-xs mono text-gold mb-1">Bio</div>
          <p class="text-sm text-muted" style="line-height:1.6">${app.bio||'—'}</p>
        </div>
        <div style="background:rgba(240,237,230,.03);border:1px solid var(--border);border-radius:3px;padding:1rem;margin-bottom:.75rem">
          <div class="text-xs mono text-gold mb-1">Proud Project</div>
          <p class="text-sm text-muted" style="line-height:1.6">${app.proud_project||'—'}</p>
        </div>
        <div style="background:rgba(240,237,230,.03);border:1px solid var(--border);border-radius:3px;padding:1rem">
          <div class="text-xs mono text-gold mb-1">Goals</div>
          <p class="text-sm text-muted" style="line-height:1.6">${app.goals||'—'}</p>
        </div>
        <div class="flex items-center gap-2 mt-2">
          <div class="text-xs mono text-gold">Portfolio:</div>
          <a href="${app.portfolio_url||'#'}" target="_blank" class="text-sm text-gold">${app.portfolio_url||'—'}</a>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:.6rem;min-width:140px">
        <button class="btn-success w-full" ${disabled?'disabled':''} onclick="window.__processApp('${app.id}','approved')">✓ Approve</button>
        <button class="btn-danger w-full" ${disabled?'disabled':''} onclick="window.__processApp('${app.id}','denied')">✗ Deny</button>
      </div>
    </div>
  </div>`;
}

function renderAll(){
  const list = currentFilter==='all' ? applications : applications.filter(a=>a.status===currentFilter);
  const container = document.getElementById('appCards');
  container.innerHTML = list.length
    ? list.map(renderCard).join('')
    : '<p class="text-muted text-sm">No applications in this category.</p>';

  document.getElementById('filterBtn-all').textContent = `All (${applications.length})`;
  document.getElementById('filterBtn-pending').textContent = `Pending (${applications.filter(a=>a.status==='pending').length})`;
  document.getElementById('filterBtn-approved').textContent = `Approved (${applications.filter(a=>a.status==='approved').length})`;
  document.getElementById('filterBtn-denied').textContent = `Denied (${applications.filter(a=>a.status==='denied').length})`;
  const navBadge = document.getElementById('navPendingBadge');
  if(navBadge) navBadge.textContent = applications.filter(a=>a.status==='pending').length;
}

window.filterApps = function(status, btn){
  currentFilter = status;
  document.querySelectorAll('[id^="filterBtn-"]').forEach(b=>b.className='btn-ghost');
  btn.className = 'btn-primary';
  renderAll();
};

window.__processApp = async function(userId, action){
  try{
    if(action==='approved') await approveApplication(userId);
    else await denyApplication(userId);
    const app = applications.find(a=>a.id===userId);
    if(app) app.status = action;
    showToast((app?.full_name||'Applicant')+(action==='approved'?' approved!':' denied.'), action==='approved'?'success':'danger');
    renderAll();
  }catch(err){
    showToast(err.message||'Failed to update application.','danger');
  }
};

async function load(){
  try{
    applications = await getAllApplications();
    renderAll();
  }catch(err){
    document.getElementById('appCards').innerHTML = `<p class="text-muted text-sm">Failed to load applications: ${err.message}</p>`;
  }
}

document.addEventListener('DOMContentLoaded',()=>{
  if(!Auth.get()?.isAdmin) { window.location.href='../pages/login.html'; return; }
  document.getElementById('filterBtn-pending').className='btn-primary';
  document.getElementById('filterBtn-all').className='btn-ghost';
  load();
});
</script>
</body>
</html>
