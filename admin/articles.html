<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Articles — Admin · Oz Indie Collective</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
</head>
<body>
<div id="nav-placeholder"></div>
<div class="admin-layout">
  <aside class="admin-sidebar">
    <div style="padding:1.25rem 1.5rem;border-bottom:1px solid var(--border);margin-bottom:.5rem">
      <div class="text-xs mono text-gold mb-1">Admin Panel</div>
      <div class="text-sm" style="color:var(--cream);font-weight:600">Oz Indie Collective</div>
    </div>
    <a href="index.html" class="admin-nav-item">Dashboard</a>
    <a href="applications.html" class="admin-nav-item">Applications <span class="admin-badge" id="navPendingBadge">…</span></a>
    <a href="members.html" class="admin-nav-item">Members</a>
    <a href="listings.html" class="admin-nav-item">Job Listings</a>
    <a href="projects.html" class="admin-nav-item">Projects</a>
    <a href="articles.html" class="admin-nav-item active">Articles</a>
    <a href="highlights.html" class="admin-nav-item">Highlights</a>
    <a href="partners.html" class="admin-nav-item">Partners</a>
    <a href="community.html" class="admin-nav-item">Community</a>
    <a href="reports.html" class="admin-nav-item">Reports</a>
    <div style="margin-top:2rem;padding:1.25rem 1.5rem;border-top:1px solid var(--border)">
      <a href="#" data-action="logout" class="text-xs text-muted mono" style="text-decoration:none;text-transform:uppercase;letter-spacing:.08em">← Exit Admin</a>
    </div>
  </aside>
  <main class="admin-main">
    <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:1px solid var(--border)">
      <div>
        <h1 style="font-family:var(--font-display);font-size:1.8rem;font-weight:700;color:var(--cream)">Articles</h1>
        <p class="text-muted text-sm mt-1">Manage the Industry Hub / Articles section shown on the public site.</p>
      </div>
      <button class="btn-primary" onclick="window.__openEditor()">+ New Article</button>
    </div>

    <div style="display:flex;flex-direction:column;gap:1rem" id="articlesContainer">
      <p class="text-muted text-sm">Loading articles…</p>
    </div>
  </main>
</div>

<!-- Editor modal -->
<div id="articleModal" style="display:none;position:fixed;inset:0;background:rgba(10,10,12,.75);z-index:100;align-items:center;justify-content:center;padding:2rem">
  <div style="background:var(--deep);border:1px solid var(--border-hi);border-radius:6px;max-width:640px;width:100%;max-height:90vh;overflow-y:auto;padding:2rem">
    <h2 style="font-family:var(--font-display);color:var(--cream);font-size:1.3rem;margin-bottom:1.25rem" id="articleModalTitle">New Article</h2>
    <form id="articleForm" style="display:flex;flex-direction:column;gap:1rem">
      <input type="hidden" id="af_id">
      <div>
        <label class="text-xs text-muted mono">Title</label>
        <input type="text" id="af_title" class="input" required>
      </div>
      <div>
        <label class="text-xs text-muted mono">Slug (URL-friendly, e.g. my-article)</label>
        <input type="text" id="af_slug" class="input" required>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
        <div>
          <label class="text-xs text-muted mono">Category</label>
          <input type="text" id="af_category" class="input" placeholder="e.g. Industry News">
        </div>
        <div>
          <label class="text-xs text-muted mono">Author Name</label>
          <input type="text" id="af_author" class="input">
        </div>
      </div>
      <div>
        <label class="text-xs text-muted mono">Cover Image</label>
        <div style="display:flex;gap:.5rem;align-items:center">
          <input type="text" id="af_cover" class="input" placeholder="https://picsum.photos/seed/oic1/800/450" style="flex:1">
          <input type="file" id="af_cover_file" accept="image/*" style="display:none">
          <button type="button" class="btn-ghost" style="font-size:.62rem;white-space:nowrap" onclick="document.getElementById('af_cover_file').click()">Upload</button>
        </div>
        <div class="text-xs text-muted mt-1" id="af_cover_status"></div>
      </div>
      <div>
        <label class="text-xs text-muted mono">Excerpt</label>
        <textarea id="af_excerpt" class="input" rows="2"></textarea>
      </div>
      <div>
        <label class="text-xs text-muted mono">Body</label>
        <textarea id="af_body" class="input" rows="8"></textarea>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
        <div>
          <label class="text-xs text-muted mono">Read Minutes</label>
          <input type="number" id="af_read" class="input" min="1">
        </div>
        <div>
          <label class="text-xs text-muted mono">Status</label>
          <select id="af_status" class="input">
            <option value="draft">Draft</option>
            <option value="published">Published</option>
          </select>
        </div>
      </div>
      <div style="display:flex;gap:.75rem;margin-top:.5rem">
        <button type="submit" class="btn-primary">Save Article</button>
        <button type="button" class="btn-ghost" onclick="window.__closeEditor()">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script src="../assets/js/nav-inject.js?v=2"></script>
<script src="../assets/js/main.js?v=4"></script>
<script type="module">
import { getAllArticles, createArticle, updateArticle, deleteArticle, uploadAdminMedia } from '../assets/js/supabase.js?v=2';

document.getElementById('af_cover_file').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const statusEl = document.getElementById('af_cover_status');
  statusEl.textContent = 'Uploading…';
  try {
    const url = await uploadAdminMedia('article-covers', file);
    document.getElementById('af_cover').value = url;
    statusEl.textContent = 'Uploaded ✓';
  } catch(err) {
    statusEl.textContent = 'Upload failed: ' + (err.message || 'unknown error');
  }
});

let articles = [];

function renderRow(a){
  const e = escapeHtml;
  const statusTag = a.status==='published' ? 'tag-approved' : 'tag-pending';
  const statusLabel = a.status.charAt(0).toUpperCase()+a.status.slice(1);
  return `
  <div style="background:rgba(245,166,35,.04);border:1px solid var(--border);border-radius:4px;padding:1.5rem;display:flex;justify-content:space-between;gap:1rem;align-items:flex-start">
    <div>
      <div class="flex gap-2 mb-1"><span class="tag ${statusTag}">${statusLabel}</span>${a.category?`<span class="tag tag-blue">${e(a.category)}</span>`:''}</div>
      <h3 style="font-family:var(--font-display);font-size:1.1rem;color:var(--cream);margin-bottom:.2rem">${e(a.title||'(untitled)')}</h3>
      <div class="text-sm text-muted">/${e(a.slug||'')} · ${e(a.author_name||'—')} ${a.read_minutes?`· ${e(a.read_minutes)} min read`:''}</div>
    </div>
    <div class="flex gap-1" style="flex-shrink:0">
      <button class="btn-ghost" style="font-size:.62rem" data-article-action="edit" data-article-id="${e(a.id)}">Edit</button>
      <button class="btn-danger" style="font-size:.62rem" data-article-action="delete" data-article-id="${e(a.id)}">Delete</button>
    </div>
  </div>`;
}

function renderAll(){
  document.getElementById('articlesContainer').innerHTML = articles.length
    ? articles.map(renderRow).join('')
    : '<p class="text-muted text-sm">No articles yet. Click "+ New Article" to add one.</p>';
}

window.__openEditor = function(){
  document.getElementById('articleModalTitle').textContent = 'New Article';
  document.getElementById('articleForm').reset();
  document.getElementById('af_id').value = '';
  document.getElementById('articleModal').style.display = 'flex';
};

window.__editArticle = function(id){
  const a = articles.find(x=>x.id===id);
  if(!a) return;
  document.getElementById('articleModalTitle').textContent = 'Edit Article';
  document.getElementById('af_id').value = a.id;
  document.getElementById('af_title').value = a.title||'';
  document.getElementById('af_slug').value = a.slug||'';
  document.getElementById('af_category').value = a.category||'';
  document.getElementById('af_author').value = a.author_name||'';
  document.getElementById('af_cover').value = a.cover_image_url||'';
  document.getElementById('af_excerpt').value = a.excerpt||'';
  document.getElementById('af_body').value = a.body||'';
  document.getElementById('af_read').value = a.read_minutes||'';
  document.getElementById('af_status').value = a.status||'draft';
  document.getElementById('articleModal').style.display = 'flex';
};

window.__closeEditor = function(){
  document.getElementById('articleModal').style.display = 'none';
};

document.getElementById('articlesContainer').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-article-action]');
  if (!btn) return;
  if (btn.dataset.articleAction === 'edit') window.__editArticle(btn.dataset.articleId);
  else window.__deleteArticle(btn.dataset.articleId);
});

window.__deleteArticle = async function(id){
  if(!confirm('Delete this article permanently?')) return;
  try{
    await deleteArticle(id);
    articles = articles.filter(a=>a.id!==id);
    renderAll();
    showToast('Article deleted.','info');
  }catch(err){ showToast(err.message||'Failed to delete article.','danger'); }
};

document.getElementById('articleForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const id = document.getElementById('af_id').value;
  const payload = {
    title: document.getElementById('af_title').value,
    slug: document.getElementById('af_slug').value,
    category: document.getElementById('af_category').value,
    author_name: document.getElementById('af_author').value,
    cover_image_url: document.getElementById('af_cover').value,
    excerpt: document.getElementById('af_excerpt').value,
    body: document.getElementById('af_body').value,
    read_minutes: document.getElementById('af_read').value ? Number(document.getElementById('af_read').value) : null,
    status: document.getElementById('af_status').value
  };
  try{
    if(id){
      const [updated] = await updateArticle(id, payload);
      const idx = articles.findIndex(a=>a.id===id);
      if(idx>-1) articles[idx] = updated;
      showToast('Article updated.','success');
    }else{
      const [created] = await createArticle(payload);
      articles.unshift(created);
      showToast('Article created.','success');
    }
    renderAll();
    window.__closeEditor();
  }catch(err){ showToast(err.message||'Failed to save article.','danger'); }
});

async function load(){
  try{
    articles = await getAllArticles();
    renderAll();
  }catch(err){
    document.getElementById('articlesContainer').innerHTML = `<p class="text-muted text-sm">Failed to load articles: ${err.message}</p>`;
  }
}

document.addEventListener('DOMContentLoaded', () => {
  if(!Auth.get()?.isAdmin) { window.location.href='../pages/login.html'; return; }
  load();
});
</script>
</body>
</html>
