<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Members — Admin · Oz Indie Collective</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
</head>
<body>
<div id="nav-placeholder"></div>
<div class="admin-layout">
  <aside class="admin-sidebar">
    <div style="padding:1.25rem 1.5rem;border-bottom:1px solid var(--border);margin-bottom:.5rem">
      <div class="text-xs mono text-gold mb-1">Admin Panel</div>
      <div class="text-sm" style="color:var(--cream);font-weight:600">Oz Indie Collective</div>
    </div>
    <a href="index.html" class="admin-nav-item">Dashboard</a>
    <a href="applications.html" class="admin-nav-item">Applications <span class="admin-badge" id="navPendingBadge">…</span></a>
    <a href="members.html" class="admin-nav-item active">Members</a>
    <a href="listings.html" class="admin-nav-item">Job Listings <span class="admin-badge">3</span></a>
    <a href="articles.html" class="admin-nav-item">Articles</a>
    <a href="highlights.html" class="admin-nav-item">Highlights</a>
    <a href="partners.html" class="admin-nav-item">Partners</a>
    <a href="reports.html" class="admin-nav-item">Reports</a>
    <div style="margin-top:2rem;padding:1.25rem 1.5rem;border-top:1px solid var(--border)">
      <a href="#" data-action="logout" class="text-xs text-muted mono" style="text-decoration:none;text-transform:uppercase;letter-spacing:.08em">← Exit Admin</a>
    </div>
  </aside>
  <main class="admin-main">
    <div style="margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:1px solid var(--border)">
      <div class="flex justify-between items-center">
        <div>
          <h1 style="font-family:var(--font-display);font-size:1.8rem;font-weight:700;color:var(--cream)">All Members</h1>
          <p class="text-muted text-sm mt-1" id="memberSummary">Loading…</p>
        </div>
        <button class="btn-ghost" onclick="window.__exportCsv()" style="font-size:.65rem">Export CSV</button>
      </div>
    </div>

    <div class="search-bar" style="margin-bottom:1.25rem">
      <input type="text" id="memberSearch" placeholder="Search by name, email, role or location…" oninput="searchMembers()">
      <button onclick="searchMembers()">Search</button>
    </div>

    <div class="filter-bar">
      <div class="form-group"><label>Plan</label><select id="fPlan" onchange="searchMembers()"><option value="">All Plans</option><option value="free">Free</option><option value="pro">Professional</option><option value="partner">Industry Partner</option></select></div>
      <div class="form-group"><label>State</label><select id="fState" onchange="searchMembers()"><option value="">All States</option></select></div>
      <div class="form-group"><label>Status</label><select id="fStatus" onchange="searchMembers()"><option value="approved">Active</option><option value="denied">Suspended</option><option value="">All</option></select></div>
    </div>

    <div style="background:rgba(240,237,230,.03);border:1px solid var(--border);border-radius:4px;overflow-x:auto">
      <table class="data-table" id="membersTable">
        <thead><tr><th>Member</th><th>Role</th><th>Location</th><th>Plan</th><th>Joined</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="membersTableBody">
          <tr><td colspan="7" class="text-muted text-sm">Loading members…</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>
<script src="../assets/js/nav-inject.js"></script>
<script src="../assets/js/main.js?v=2"></script>
<script type="module">
import { getAllApplications, approveApplication, denyApplication } from '../assets/js/supabase.js';

let members = [];
const AVATAR_CLASSES = ['av-gold','av-rust','av-sage','av-blue','av-purple'];
function avatarClass(seed=''){
  let h = 0;
  for(let i=0;i<seed.length;i++) h = (h*31 + seed.charCodeAt(i)) >>> 0;
  return AVATAR_CLASSES[h % AVATAR_CLASSES.length];
}
function initials(name=''){
  return name.split(' ').slice(0,2).map(w=>w[0]?.toUpperCase()||'').join('')||'?';
}
function fmtDate(iso){
  if(!iso) return '—';
  return new Date(iso).toLocaleDateString('en-AU',{month:'short',year:'numeric'});
}

function renderRow(m){
  const planTag = {free:'tag-gold',pro:'tag-sage',partner:'tag-rust'}[m.plan] || 'tag-gold';
  const suspended = m.status === 'denied';
  const statusTag = suspended ? 'tag-denied' : 'tag-approved';
  return `<tr data-id="${m.id}">
    <td><div class="flex items-center gap-2"><div class="avatar avatar-sm ${avatarClass(m.full_name)}">${initials(m.full_name)}</div><div><div style="color:var(--cream);font-weight:600">${m.full_name||'(no name)'}</div><div class="text-xs text-muted">${m.email||''}</div></div></div></td>
    <td>${m.role||'—'}</td>
    <td>${[m.city,m.state].filter(Boolean).join(', ')||'—'}</td>
    <td><span class="tag ${planTag}" style="font-size:.55rem">${m.plan||'free'}</span></td>
    <td>${fmtDate(m.created_at)}</td>
    <td><span class="tag ${statusTag}" style="font-size:.55rem">${suspended?'Suspended':'Active'}</span></td>
    <td><div class="flex gap-1">
      ${suspended
        ? `<button class="btn-success" style="font-size:.58rem;padding:.3rem .6rem" onclick="window.__reinstateMember('${m.id}')">Reinstate</button>`
        : `<button class="btn-danger" style="font-size:.58rem;padding:.3rem .6rem" onclick="window.__suspendMember('${m.id}','${(m.full_name||'this member').replace(/'/g,"\\'")}')">Suspend</button>`}
    </div></td>
  </tr>`;
}

function populateStateFilter(){
  const sel = document.getElementById('fState');
  const states = [...new Set(members.map(m=>m.state).filter(Boolean))].sort();
  sel.innerHTML = '<option value="">All States</option>' + states.map(s=>`<option>${s}</option>`).join('');
}

window.searchMembers = function(){
  const q = document.getElementById('memberSearch').value.toLowerCase();
  const plan = document.getElementById('fPlan').value;
  const state = document.getElementById('fState').value;
  const status = document.getElementById('fStatus').value;

  const filtered = members.filter(m => {
    if(status && m.status !== status) return false;
    if(!status && !['approved','denied'].includes(m.status)) return false;
    if(plan && m.plan !== plan) return false;
    if(state && m.state !== state) return false;
    if(q){
      const text = `${m.full_name||''} ${m.email||''} ${m.role||''} ${m.city||''} ${m.state||''}`.toLowerCase();
      if(!text.includes(q)) return false;
    }
    return true;
  });

  document.getElementById('membersTableBody').innerHTML = filtered.length
    ? filtered.map(renderRow).join('')
    : '<tr><td colspan="7" class="text-muted text-sm">No members match these filters.</td></tr>';
  window.__filteredMembers = filtered;
};

window.__suspendMember = async function(id, name){
  if(!confirm('Suspend '+name+'? They will lose access until reinstated.')) return;
  try{
    await denyApplication(id);
    const m = members.find(x=>x.id===id); if(m) m.status='denied';
    showToast(name+' suspended.','danger');
    searchMembers();
  }catch(err){ showToast(err.message||'Failed to suspend.','danger'); }
};
window.__reinstateMember = async function(id){
  try{
    await approveApplication(id);
    const m = members.find(x=>x.id===id); if(m) m.status='approved';
    showToast('Member reinstated.','success');
    searchMembers();
  }catch(err){ showToast(err.message||'Failed to reinstate.','danger'); }
};

window.__exportCsv = function(){
  const rows = window.__filteredMembers || [];
  if(!rows.length){ showToast('Nothing to export.','info'); return; }
  const headers = ['Name','Email','Role','City','State','Plan','Status','Joined'];
  const csvRows = rows.map(m => [m.full_name,m.email,m.role,m.city,m.state,m.plan,m.status,m.created_at]
    .map(v => `"${(v??'').toString().replace(/"/g,'""')}"`).join(','));
  const csv = [headers.join(','), ...csvRows].join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'oic-members.csv'; a.click();
  URL.revokeObjectURL(url);
};

async function load(){
  try{
    members = await getAllApplications();
    populateStateFilter();
    const approved = members.filter(m=>m.status==='approved');
    document.getElementById('memberSummary').textContent =
      `${approved.length} approved members · ${approved.filter(m=>m.plan==='pro').length} Professional · ${approved.filter(m=>m.plan==='partner').length} Industry Partners`;
    const navBadge = document.getElementById('navPendingBadge');
    if(navBadge) navBadge.textContent = members.filter(m=>m.status==='pending').length;
    searchMembers();
  }catch(err){
    document.getElementById('membersTableBody').innerHTML = `<tr><td colspan="7" class="text-muted text-sm">Failed to load: ${err.message}</td></tr>`;
  }
}

document.addEventListener('DOMContentLoaded', () => {
  if(!Auth.get()?.isAdmin) { window.location.href='../pages/login.html'; return; }
  load();
});
</script>
</body>
</html>
