<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Community — Oz Indie Collective</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<style>
.feed-layout{display:grid;grid-template-columns:1fr 300px;gap:2rem}
.post-card{background:rgba(240,237,230,.03);border:1px solid var(--border);border-radius:4px;padding:1.35rem;margin-bottom:1rem;transition:.2s}
.post-card:hover{border-color:var(--border-hi)}
.post-header{display:flex;align-items:center;gap:.85rem;margin-bottom:.85rem}
.post-body{font-size:.88rem;color:rgba(240,237,230,.8);line-height:1.7;margin-bottom:.85rem}
.post-actions{display:flex;gap:1rem}
.post-action{font-family:var(--font-mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:none;border:none;cursor:pointer;transition:color .2s;padding:0}
.post-action:hover{color:var(--marigold)}
.compose-box{background:rgba(240,237,230,.03);border:1px solid var(--border);border-radius:4px;padding:1.25rem;margin-bottom:1.5rem}
@media(max-width:900px){.feed-layout{grid-template-columns:1fr}}
</style>
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
</head>
<body>
<div id="nav-placeholder"></div>
<div class="page-hero" style="background-image:linear-gradient(rgba(10,10,12,.72),rgba(10,10,12,.85)),url('https://picsum.photos/seed/oic-community/1600/500');background-size:cover;background-position:center">
  <div class="inner">
    <div class="section-label">Community</div>
    <h1 class="section-title">The OIC <em>Community Feed</em></h1>
    <p class="text-muted mt-2" style="max-width:560px;line-height:1.7">Share updates, ask questions, celebrate wins, post calls for collaborators and connect with fellow members.</p>
  </div>
</div>
<section style="background:var(--ink)">
  <div class="inner">
    <div class="feed-layout">
      <div>
        <!-- Compose -->
        <div class="compose-box" id="composeArea">
          <div class="flex items-center gap-2 mb-2">
            <div class="avatar avatar-sm av-gold" data-user-initials>?</div>
            <textarea id="postInput" placeholder="Share something with the Collective…" style="flex:1;background:transparent;border:none;color:var(--cream);font-family:var(--font-body);font-size:.88rem;resize:none;outline:none;line-height:1.6" rows="2"></textarea>
          </div>
          <div class="flex justify-between items-center">
            <div class="flex gap-2">
              <button class="post-action" onclick="showToast('Image upload coming soon','info')">📷 Photo</button>
              <button class="post-action" onclick="showToast('Link sharing coming soon','info')">🔗 Link</button>
            </div>
            <button class="btn-primary" style="font-size:.65rem;padding:.45rem 1rem" onclick="submitPost()">Post</button>
          </div>
        </div>

        <div id="guestPrompt" class="alert alert-info hidden mb-3"><span>👋</span><span><a href="login.html" class="text-gold">Sign in</a> or <a href="join.html" class="text-gold">join</a> to post and comment.</span></div>

        <!-- Feed -->
        <div id="feedPosts">
          <p class="text-muted text-sm">Loading posts…</p>
        </div>
      </div>

      <aside>
        <div style="background:rgba(240,237,230,.03);border:1px solid var(--border);border-radius:4px;padding:1.35rem;margin-bottom:1.25rem">
          <h3 style="font-family:var(--font-mono);font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:var(--marigold);margin-bottom:1rem">Community Stats</h3>
          <div style="display:flex;flex-direction:column;gap:.75rem">
            <div class="flex justify-between"><span class="text-sm text-muted">Members</span><span class="text-sm" style="color:var(--cream);font-weight:600" id="statMembers">…</span></div>
            <div class="flex justify-between"><span class="text-sm text-muted">Posts Today</span><span class="text-sm" style="color:var(--cream);font-weight:600" id="statPostsToday">…</span></div>
            <div class="flex justify-between"><span class="text-sm text-muted">New This Week</span><span class="text-sm" style="color:var(--cream);font-weight:600" id="statNewMembers">…</span></div>
          </div>
        </div>
        <div style="background:rgba(240,237,230,.03);border:1px solid var(--border);border-radius:4px;padding:1.35rem">
          <h3 style="font-family:var(--font-mono);font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:var(--marigold);margin-bottom:1rem">New Members</h3>
          <div style="display:flex;flex-direction:column;gap:.75rem" id="newMembersList">
            <p class="text-muted text-sm">Loading…</p>
          </div>
        </div>
      </aside>
    </div>
  </div>
</section>
<div id="footer-placeholder"></div>
<script src="../assets/js/nav-inject.js?v=3"></script>
<script src="../assets/js/main.js?v=5"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  if(!Auth.get()) {
    document.getElementById('composeArea').style.display='none';
    document.getElementById('guestPrompt').classList.remove('hidden');
  }
});
</script>
<script type="module">
import {
  getCommunityPosts, createCommunityPost, deleteCommunityPost,
  getCommunityComments, createCommunityComment,
  toggleCommunityLike, getMyLikedPostIds, reportCommunityContent,
  getMembers, getSession
} from '../assets/js/supabase.js?v=13';

let posts = [];
let likedPostIds = new Set();
let currentUserId = null;

function timeAgo(iso){
  if(!iso) return '';
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diffMs/60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return mins+'m ago';
  const hrs = Math.floor(mins/60);
  if(hrs < 24) return hrs+'h ago';
  return Math.floor(hrs/24)+'d ago';
}

const AVATAR_CLASSES = ['av-gold','av-rust','av-sage','av-blue','av-purple'];
function avatarClass(seed=''){
  let h = 0;
  for(let i=0;i<seed.length;i++) h = (h*31 + seed.charCodeAt(i)) >>> 0;
  return AVATAR_CLASSES[h % AVATAR_CLASSES.length];
}

const TAG_LABELS = { win: 'Win 🎉', seeking: 'Seeking', resource: 'Resource' };
const TAG_CLASSES = { win: 'tag-gold', seeking: 'tag-rust', resource: 'tag-blue' };

function postCardHtml(p){
  const e = escapeHtml;
  const author = p.profiles || {};
  const likeCount = p.community_likes?.[0]?.count || 0;
  const commentCount = p.community_comments?.[0]?.count || 0;
  const liked = likedPostIds.has(p.id);
  const isOwn = currentUserId && p.author_id === currentUserId;
  return `
  <div class="post-card fade-in" data-post-id="${e(p.id)}">
    <div class="post-header">
      <div class="avatar avatar-sm ${avatarClass(author.full_name||p.author_id)}">${e((author.full_name||'?').split(' ').slice(0,2).map(w=>w[0]?.toUpperCase()||'').join('')||'?')}</div>
      <div><div style="font-size:.85rem;font-weight:600;color:var(--cream)">${e(author.full_name||'Member')}</div><div class="text-xs mono text-muted">${e(author.role||'')}${author.role?' · ':''}${e([author.city,author.state].filter(Boolean).join(', '))} · ${timeAgo(p.created_at)}</div></div>
      ${p.tag && TAG_LABELS[p.tag] ? `<span class="tag ${TAG_CLASSES[p.tag]}" style="margin-left:auto;font-size:.55rem">${e(TAG_LABELS[p.tag])}</span>` : ''}
    </div>
    <div class="post-body">${e(p.body)}</div>
    <div class="post-actions">
      <button class="post-action" data-action="like" style="${liked?'color:var(--marigold)':''}">♥ ${likeCount} ${likeCount===1?'Like':'Likes'}</button>
      <button class="post-action" data-action="comments">💬 <span data-comment-count>${commentCount}</span> ${commentCount===1?'Comment':'Comments'}</button>
      <button class="post-action" data-action="share">↗ Share</button>
      <button class="post-action" data-action="report">⚑ Report</button>
      ${isOwn ? `<button class="post-action" data-action="delete" style="color:var(--rust)">Delete</button>` : ''}
    </div>
    <div class="hidden" data-comments-wrap style="margin-top:.85rem;border-top:1px solid var(--border);padding-top:.85rem">
      <div data-comments-list style="display:flex;flex-direction:column;gap:.6rem;margin-bottom:.75rem"></div>
      <div class="flex gap-2" data-auth="logged-in" style="display:${Auth.get()?'flex':'none'}">
        <input type="text" data-comment-input placeholder="Write a comment…" style="flex:1;background:rgba(240,237,230,.04);border:1px solid var(--border);border-radius:3px;padding:.5rem .75rem;color:var(--cream);font-size:.82rem;outline:none">
        <button class="btn-primary" style="font-size:.6rem;padding:.4rem .8rem" data-action="send-comment">Send</button>
      </div>
    </div>
  </div>`;
}

function renderFeed(){
  document.getElementById('feedPosts').innerHTML = posts.length
    ? posts.map(postCardHtml).join('')
    : '<p class="text-muted text-sm">No posts yet — be the first to share something with the Collective.</p>';
}

async function loadFeed(){
  try{
    posts = await getCommunityPosts();
    const session = await getSession();
    currentUserId = session?.user?.id || null;
    likedPostIds = new Set(currentUserId ? await getMyLikedPostIds(posts.map(p=>p.id)) : []);
    renderFeed();

    const today = new Date(); today.setHours(0,0,0,0);
    const postsToday = posts.filter(p => new Date(p.created_at) >= today).length;
    document.getElementById('statPostsToday').textContent = postsToday;
  }catch(err){
    document.getElementById('feedPosts').innerHTML = `<p class="text-muted text-sm">Failed to load the feed: ${escapeHtml(err.message)}</p>`;
  }
}

async function loadSidebar(){
  try{
    const members = await getMembers();
    document.getElementById('statMembers').textContent = members.length;
    const weekAgo = Date.now() - 7*24*60*60*1000;
    document.getElementById('statNewMembers').textContent = '+' + members.filter(m => new Date(m.created_at).getTime() > weekAgo).length;

    const recent = [...members].sort((a,b)=> new Date(b.created_at)-new Date(a.created_at)).slice(0,3);
    document.getElementById('newMembersList').innerHTML = recent.length ? recent.map(m => `
      <div class="flex items-center gap-2"><div class="avatar avatar-sm ${avatarClass(m.full_name)}">${escapeHtml((m.full_name||'?').split(' ').slice(0,2).map(w=>w[0]?.toUpperCase()||'').join('')||'?')}</div><div><div class="text-sm" style="color:var(--cream)">${escapeHtml(m.full_name||'Member')}</div><div class="text-xs text-muted">${escapeHtml(m.role||'')} · ${escapeHtml(m.city||'')}</div></div></div>
    `).join('') : '<p class="text-muted text-sm">No members yet.</p>';
  }catch(err){
    document.getElementById('statMembers').textContent = '—';
    document.getElementById('statNewMembers').textContent = '—';
    document.getElementById('newMembersList').innerHTML = '<p class="text-muted text-sm">Failed to load.</p>';
  }
}

window.submitPost = async function(){
  const input = document.getElementById('postInput');
  const val = input.value.trim();
  if(!val) return;
  if(!Auth.get()) { window.location.href = 'login.html'; return; }
  try{
    const post = await createCommunityPost({ body: val });
    posts.unshift(post);
    renderFeed();
    input.value = '';
    showToast('Posted to the community!','success');
  }catch(err){
    showToast(err.message || 'Failed to post.','danger');
  }
};

document.getElementById('feedPosts').addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const card = btn.closest('.post-card');
  const postId = card.dataset.postId;
  const action = btn.dataset.action;

  if (action === 'like') {
    if (!Auth.get()) { window.location.href = 'login.html'; return; }
    try {
      const { liked, count } = await toggleCommunityLike(postId);
      if (liked) likedPostIds.add(postId); else likedPostIds.delete(postId);
      btn.textContent = `♥ ${count} ${count===1?'Like':'Likes'}`;
      btn.style.color = liked ? 'var(--marigold)' : '';
    } catch(err) { showToast(err.message || 'Failed to like post.','danger'); }
  }

  else if (action === 'comments') {
    const wrap = card.querySelector('[data-comments-wrap]');
    const wasHidden = wrap.classList.contains('hidden');
    wrap.classList.toggle('hidden');
    if (wasHidden) {
      const list = card.querySelector('[data-comments-list]');
      list.innerHTML = '<p class="text-muted text-sm">Loading comments…</p>';
      try {
        const comments = await getCommunityComments(postId);
        list.innerHTML = comments.length ? comments.map(c => `
          <div class="flex gap-2" style="align-items:flex-start">
            <div class="avatar avatar-sm ${avatarClass(c.profiles?.full_name||c.author_id)}" style="font-size:.55rem">${escapeHtml((c.profiles?.full_name||'?').split(' ').slice(0,2).map(w=>w[0]?.toUpperCase()||'').join('')||'?')}</div>
            <div style="flex:1"><div class="text-xs" style="color:var(--cream);font-weight:600">${escapeHtml(c.profiles?.full_name||'Member')} <span class="text-muted" style="font-weight:400">· ${timeAgo(c.created_at)}</span></div><div class="text-sm text-muted" style="line-height:1.5">${escapeHtml(c.body)}</div></div>
          </div>
        `).join('') : '<p class="text-muted text-sm">No comments yet.</p>';
      } catch(err) {
        list.innerHTML = `<p class="text-muted text-sm">Failed to load comments.</p>`;
      }
    }
  }

  else if (action === 'send-comment') {
    if (!Auth.get()) { window.location.href = 'login.html'; return; }
    const input = card.querySelector('[data-comment-input]');
    const body = input.value.trim();
    if (!body) return;
    try {
      const comment = await createCommunityComment(postId, body);
      const list = card.querySelector('[data-comments-list]');
      if (list.querySelector('p')) list.innerHTML = '';
      list.insertAdjacentHTML('beforeend', `
        <div class="flex gap-2" style="align-items:flex-start">
          <div class="avatar avatar-sm ${avatarClass(comment.profiles?.full_name)}" style="font-size:.55rem">${escapeHtml((comment.profiles?.full_name||'?').split(' ').slice(0,2).map(w=>w[0]?.toUpperCase()||'').join('')||'?')}</div>
          <div style="flex:1"><div class="text-xs" style="color:var(--cream);font-weight:600">${escapeHtml(comment.profiles?.full_name||'Member')} <span class="text-muted" style="font-weight:400">· just now</span></div><div class="text-sm text-muted" style="line-height:1.5">${escapeHtml(comment.body)}</div></div>
        </div>
      `);
      input.value = '';
      const countEl = card.querySelector('[data-comment-count]');
      countEl.textContent = Number(countEl.textContent) + 1;
    } catch(err) {
      showToast(err.message || 'Failed to post comment.','danger');
    }
  }

  else if (action === 'share') {
    const url = `${window.location.origin}${window.location.pathname}#post-${postId}`;
    try {
      await navigator.clipboard.writeText(url);
      showToast('Link copied to clipboard!','success');
    } catch(err) {
      showToast('Could not copy link — copy it from the address bar.','info');
    }
  }

  else if (action === 'report') {
    if (!Auth.get()) { window.location.href = 'login.html'; return; }
    const reason = prompt('Why are you reporting this post? (e.g. spam, harassment, inappropriate content)');
    if (reason === null) return;
    try {
      await reportCommunityContent({ postId, reason });
      showToast('Thanks — our team will review this.','success');
    } catch(err) {
      showToast(err.message || 'Failed to submit report.','danger');
    }
  }

  else if (action === 'delete') {
    if (!confirm('Delete this post?')) return;
    try {
      await deleteCommunityPost(postId);
      posts = posts.filter(p => p.id !== postId);
      renderFeed();
      showToast('Post deleted.','info');
    } catch(err) {
      showToast(err.message || 'Failed to delete post.','danger');
    }
  }
});

document.getElementById('postInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); window.submitPost(); }
});

loadFeed();
loadSidebar();
</script>
</body>
</html>
