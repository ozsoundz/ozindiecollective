<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Articles — Oz Indie Collective</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<style>
.articles-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.75rem}
.article-tile{background:rgba(240,237,230,.03);border:1px solid var(--border);border-radius:4px;overflow:hidden;text-decoration:none;transition:.2s;display:block}
.article-tile:hover{border-color:var(--border-hi);transform:translateY(-2px)}
.article-tile img{width:100%;height:160px;object-fit:cover;display:block;background:rgba(240,237,230,.05)}
.article-tile-body{padding:1.25rem}
.article-cat{font-family:var(--font-mono);font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan);margin-bottom:.4rem}
.article-title{font-size:1rem;font-weight:600;color:var(--cream);line-height:1.4;margin-bottom:.4rem}
.article-meta{font-size:.72rem;color:var(--muted)}
@media(max-width:900px){.articles-grid{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.articles-grid{grid-template-columns:1fr}}
</style>
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
</head>
<body>
<div id="nav-placeholder"></div>
<div class="page-hero" style="background-image:linear-gradient(rgba(10,10,12,.72),rgba(10,10,12,.85)),url('https://picsum.photos/seed/oic-articles-hero/1600/500');background-size:cover;background-position:center">
  <div class="inner">
    <div class="section-label">Articles</div>
    <h1 class="section-title">Stories From the <em>Collective</em></h1>
    <p class="text-muted mt-2" style="max-width:560px;line-height:1.7">News, essays and features from and about Australia's independent creative community.</p>
  </div>
</div>

<section style="background:var(--ink)">
  <div class="inner">
    <div id="articleDetail" class="hidden">
      <a href="articles.html" class="text-sm" style="color:var(--cyan);text-decoration:none;display:inline-block;margin-bottom:1.5rem">← Back to all articles</a>
      <div id="articleDetailBody"></div>
    </div>
    <div id="articleList">
      <div class="articles-grid" id="articlesGrid">
        <p class="text-muted text-sm">Loading articles…</p>
      </div>
    </div>
  </div>
</section>

<div id="footer-placeholder"></div>
<script src="../assets/js/nav-inject.js?v=3"></script>
<script src="../assets/js/main.js?v=5"></script>
<script type="module">
import { getArticles, getArticleBySlug } from '../assets/js/supabase.js?v=13';

function tileFor(a){
  const img = a.cover_image_url || `https://picsum.photos/seed/${encodeURIComponent(a.slug||a.id)}/500/300`;
  const e = escapeHtml;
  return `
  <a href="articles.html?slug=${encodeURIComponent(a.slug||'')}" class="article-tile">
    <img src="${e(sanitizeUrl(img))}" alt="${e(a.title||'')}">
    <div class="article-tile-body">
      <div class="article-cat">${e(a.category||'Article')}</div>
      <div class="article-title">${e(a.title||'(untitled)')}</div>
      <div class="article-meta">${e(a.author_name||'Oz Indie Collective')} ${a.read_minutes?`· ${e(a.read_minutes)} min read`:''}</div>
    </div>
  </a>`;
}

async function renderList(){
  try{
    const articles = await getArticles();
    document.getElementById('articlesGrid').innerHTML = articles.length
      ? articles.map(tileFor).join('')
      : '<p class="text-muted text-sm">No articles published yet — check back soon.</p>';
  }catch(err){
    document.getElementById('articlesGrid').innerHTML = `<p class="text-muted text-sm">Failed to load articles: ${err.message}</p>`;
  }
}

async function renderDetail(slug){
  document.getElementById('articleList').classList.add('hidden');
  document.getElementById('articleDetail').classList.remove('hidden');
  const body = document.getElementById('articleDetailBody');
  try{
    const a = await getArticleBySlug(slug);
    const e = escapeHtml;
    const img = a.cover_image_url || `https://picsum.photos/seed/${encodeURIComponent(a.slug||a.id)}/1000/450`;
    body.innerHTML = `
      <div class="article-cat">${e(a.category||'Article')}</div>
      <h1 style="font-family:var(--font-display);font-size:2rem;color:var(--cream);margin:.5rem 0 1rem;line-height:1.2">${e(a.title||'')}</h1>
      <div class="text-sm text-muted" style="margin-bottom:1.5rem">${e(a.author_name||'Oz Indie Collective')} ${a.read_minutes?`· ${e(a.read_minutes)} min read`:''}</div>
      <img src="${e(sanitizeUrl(img))}" alt="" style="width:100%;max-height:420px;object-fit:cover;border-radius:4px;margin-bottom:1.75rem">
      <div class="text-muted" style="line-height:1.9;max-width:720px;white-space:pre-wrap">${e(a.body||a.excerpt||'')}</div>
    `;
  }catch(err){
    body.innerHTML = `<p class="text-muted text-sm">Article not found.</p>`;
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  const slug = params.get('slug');
  if (slug) { renderDetail(slug); } else { renderList(); }
});
</script>
</body>
</html>
