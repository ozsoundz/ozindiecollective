<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Member Directory — Oz Indie Collective</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
</head>
<body>
<div id="nav-placeholder"></div>
<div class="page-hero" style="background-image:linear-gradient(rgba(10,10,12,.72),rgba(10,10,12,.85)),url('https://picsum.photos/seed/oic-directory/1600/500');background-size:cover;background-position:center">
  <div class="inner">
    <div class="section-label">Member Directory</div>
    <h1 class="section-title">Find Your Next <em>Collaborator</em></h1>
    <p class="text-muted mt-2" style="max-width:560px;line-height:1.7">Browse 4,200+ vetted creative professionals across Australia. Every profile in the directory has been personally approved.</p>
  </div>
</div>
<section style="background:var(--ink)">
  <div class="inner">
    <div class="search-bar">
      <input type="text" id="dirSearch" placeholder="Search by name, skill, location or discipline…" oninput="filterDir()">
      <button onclick="filterDir()">Search</button>
    </div>
    <div class="filter-bar">
      <div class="form-group"><label>Discipline</label>
        <select id="fRole" onchange="filterDir()">
          <option value="">All Disciplines</option>
        </select>
      </div>
      <div class="form-group"><label>State</label>
        <select id="fState" onchange="filterDir()">
          <option value="">All States</option>
          <option>NSW</option><option>VIC</option><option>QLD</option>
          <option>SA</option><option>WA</option><option>TAS</option>
        </select>
      </div>
      <div class="form-group"><label>Availability</label>
        <select id="fAvail" onchange="filterDir()">
          <option value="">Any</option>
          <option value="available">Available Now</option>
          <option value="selective">Selectively Available</option>
        </select>
      </div>
      <div class="form-group"><label>Plan</label>
        <select id="fPlan" onchange="filterDir()">
          <option value="">All Members</option>
          <option value="pro">Professional+</option>
          <option value="partner">Industry Partners</option>
        </select>
      </div>
    </div>

    <div class="flex justify-between items-center mb-3">
      <div class="text-sm text-muted"><span id="dirCount">…</span> members found</div>
    </div>

    <div id="dirGrid" class="grid-3" style="gap:1.25rem">
      <p class="text-muted text-sm">Loading members…</p>
    </div>
  </div>
</section>
<div id="footer-placeholder"></div>
<script src="../assets/js/nav-inject.js?v=3"></script>
<script src="../assets/js/main.js?v=4"></script>
<script type="module">
import { getMembers } from '../assets/js/supabase.js?v=2';

const AVATAR_CLASSES = ['av-gold','av-rust','av-sage','av-blue','av-purple'];
function avatarClass(seed=''){
  let h = 0;
  for(let i=0;i<seed.length;i++) h = (h*31 + seed.charCodeAt(i)) >>> 0;
  return AVATAR_CLASSES[h % AVATAR_CLASSES.length];
}
function initials(name=''){
  return name.split(' ').slice(0,2).map(w=>w[0]?.toUpperCase()||'').join('')||'?';
}
const TAG_CLASSES = ['tag-gold','tag-sage','tag-blue','tag-rust'];

let members = [];

function renderCard(m){
  const skills = (m.skills||[]).slice(0,3);
  const e = escapeHtml;
  return `
  <a href="profile.html?id=${e(m.id)}" class="member-card fade-in" data-role="${e(m.role||'')}" data-state="${e(m.state||'')}" data-avail="${e(m.availability||'available')}" data-plan="${e(m.plan||'free')}">
    <div class="member-card-top"><div class="avatar avatar-md ${m.avatar_url?'':avatarClass(m.full_name)}">${m.avatar_url?`<img src="${e(m.avatar_url)}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`:e(initials(m.full_name))}</div><div><div class="member-name">${e(m.full_name||'(no name)')}</div><div class="member-role">${e(m.role||'—')}</div></div></div>
    <div class="member-location">📍 ${e([m.city,m.state].filter(Boolean).join(', ')||'—')}</div>
    <div class="member-skills">${skills.map((s,i)=>`<span class="tag ${TAG_CLASSES[i%TAG_CLASSES.length]}">${e(s)}</span>`).join('')}</div>
    <div class="member-foot"><span class="text-xs text-muted">${e(m.experience||'')}</span><span class="text-xs">${(m.availability||'available')==='available'?'<span class="avail-dot"></span>Available':'<span class="text-xs text-muted">Selective</span>'}</span></div>
  </a>`;
}

function populateRoleFilter(){
  const sel = document.getElementById('fRole');
  const roles = [...new Set(members.map(m=>m.role).filter(Boolean))].sort();
  sel.innerHTML = '<option value="">All Disciplines</option>' + roles.map(r=>`<option>${escapeHtml(r)}</option>`).join('');
}

window.filterDir = function() {
  const role = document.getElementById('fRole').value;
  const state = document.getElementById('fState').value;
  const avail = document.getElementById('fAvail').value;
  const plan = document.getElementById('fPlan').value;
  const q = document.getElementById('dirSearch').value.toLowerCase();
  let count = 0;
  document.querySelectorAll('#dirGrid .member-card').forEach(card => {
    const text = card.textContent.toLowerCase();
    const ok = (!role || card.dataset.role === role)
      && (!state || card.dataset.state === state)
      && (!avail || card.dataset.avail === avail)
      && (!plan || card.dataset.plan === plan || (plan==='pro' && card.dataset.plan==='partner'))
      && (!q || text.includes(q));
    card.style.display = ok ? '' : 'none';
    if(ok) count++;
  });
  document.getElementById('dirCount').textContent = count;
}

async function load(){
  const grid = document.getElementById('dirGrid');
  try{
    members = await getMembers();
    grid.innerHTML = members.length ? members.map(renderCard).join('') : '<p class="text-muted text-sm">No approved members yet.</p>';
    populateRoleFilter();
    document.getElementById('dirCount').textContent = members.length;

    // Handle URL params for pre-filtering, matched loosely against real role strings
    const urlType = new URLSearchParams(window.location.search).get('type');
    if(urlType){
      const map = {musician:'Musician',artist:'Designer',engineer:'Audio Engineer',ld:'Lighting',stage:'Stage Manager',manager:'Artist Manager',producer:'Producer',video:'Videographer',photo:'Photographer',content:'Content Creator',design:'Designer',event:'Event Producer'};
      const needle = map[urlType];
      if(needle){
        const sel = document.getElementById('fRole');
        const match = [...sel.options].find(o=>o.value.toLowerCase().includes(needle.toLowerCase()));
        if(match){ sel.value = match.value; filterDir(); }
      }
    }
  }catch(err){
    grid.innerHTML = `<p class="text-muted text-sm">Failed to load members: ${err.message}</p>`;
  }
}

document.addEventListener('DOMContentLoaded', load);
</script>
</body>
</html>
