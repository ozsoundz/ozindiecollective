<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password — Oz Indie Collective</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css?v=6e921d52">
<style>
.login-wrap{min-height:calc(100vh - var(--nav-h));display:flex;align-items:center;justify-content:center;padding:2rem;margin-top:var(--nav-h)}
.login-card{background:rgba(240,237,230,.03);border:1px solid var(--border);border-radius:6px;padding:2.75rem;width:100%;max-width:440px}
.login-logo{text-align:center;margin-bottom:2rem}
</style>
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
</head>
<body>
<div id="nav-placeholder"></div>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <img src="../assets/img/logo.jpg" alt="Oz Indie Collective" class="logo-mark" style="margin:0 auto 1rem;width:56px;height:56px">
      <h1 style="font-family:var(--font-display);font-size:1.6rem;font-weight:700;color:var(--cream);margin-bottom:.35rem">Set a new password</h1>
      <p class="text-muted text-sm" id="rp_subtitle">Verifying your reset link…</p>
    </div>

    <form id="resetForm" novalidate class="hidden">
      <div class="form-group"><label>New Password</label><input type="password" name="password" placeholder="••••••••"></div>
      <div class="form-group"><label>Confirm New Password</label><input type="password" name="confirm" placeholder="••••••••"></div>
      <button type="submit" class="btn-primary btn-lg w-full">Set New Password</button>
    </form>

    <div id="rp_invalid" class="hidden">
      <p class="text-muted text-sm" style="margin-bottom:1.25rem;line-height:1.6">This reset link is invalid or has expired. Request a new one from the sign-in page.</p>
      <a href="login.html" class="btn-secondary btn-lg w-full text-center" style="display:block">Back to Sign In</a>
    </div>
  </div>
</div>
<div id="footer-placeholder"></div>
<script src="../assets/js/nav-inject.js?v=a6639f56"></script>
<script src="../assets/js/main.js?v=6c071eaa"></script>
<script type="module">
import { supabase, updatePassword } from '../assets/js/supabase.js?v=769a23b7';

let recoveryReady = false;

// Supabase auto-detects the recovery token in the URL and fires this event
// once a temporary recovery session is established.
supabase.auth.onAuthStateChange((event, session) => {
  if (event === 'PASSWORD_RECOVERY' && session) {
    recoveryReady = true;
    document.getElementById('rp_subtitle').textContent = 'Choose a new password for your account.';
    document.getElementById('resetForm').classList.remove('hidden');
  }
});

// Fallback: if the event already fired before this listener attached, check
// directly for an existing session (some browsers/timing).
setTimeout(async () => {
  if (recoveryReady) return;
  const { data: { session } } = await supabase.auth.getSession();
  if (session) {
    recoveryReady = true;
    document.getElementById('rp_subtitle').textContent = 'Choose a new password for your account.';
    document.getElementById('resetForm').classList.remove('hidden');
  } else {
    document.getElementById('rp_subtitle').textContent = '';
    document.getElementById('rp_invalid').classList.remove('hidden');
  }
}, 2500);

document.getElementById('resetForm').addEventListener('submit', async function(e){
  e.preventDefault();
  const pw = this.querySelector('[name=password]').value;
  const confirm = this.querySelector('[name=confirm]').value;
  if(!pw || pw.length < 8) { showToast('Password must be at least 8 characters.','danger'); return; }
  if(pw !== confirm) { showToast('Passwords do not match.','danger'); return; }

  const btn = this.querySelector('button[type=submit]');
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    await updatePassword(pw);
    showToast('Password updated! You can now sign in.','success');
    setTimeout(() => { window.location.href = 'login.html'; }, 1200);
  } catch (err) {
    showToast(err.message || 'Failed to update password.','danger');
  } finally {
    btn.disabled = false; btn.textContent = 'Set New Password';
  }
});
</script>
</body>
</html>
