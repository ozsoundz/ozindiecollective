<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Messages — Oz Indie Collective</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
<style>
.msg-layout{display:grid;grid-template-columns:320px 1fr;min-height:calc(100vh - var(--nav-h));margin-top:var(--nav-h)}
.msg-inbox{border-right:1px solid var(--border);overflow-y:auto;max-height:calc(100vh - var(--nav-h))}
.msg-inbox-item{display:flex;gap:.75rem;padding:1rem 1.25rem;border-bottom:1px solid var(--border);cursor:pointer;transition:.15s}
.msg-inbox-item:hover{background:rgba(240,237,230,.04)}
.msg-inbox-item.active{background:rgba(245,166,35,.08);border-left:2px solid var(--marigold)}
.msg-thread{display:flex;flex-direction:column;height:calc(100vh - var(--nav-h))}
.msg-thread-header{padding:1.25rem 1.5rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.75rem}
.msg-thread-body{flex:1;overflow-y:auto;padding:1.5rem;display:flex;flex-direction:column;gap:.75rem}
.msg-bubble{max-width:60%;padding:.65rem 1rem;border-radius:12px;font-size:.85rem;line-height:1.5}
.msg-bubble.mine{align-self:flex-end;background:var(--marigold);color:#1a1305;border-bottom-right-radius:3px}
.msg-bubble.theirs{align-self:flex-start;background:rgba(240,237,230,.06);color:var(--cream);border-bottom-left-radius:3px}
.msg-meta{font-size:.62rem;color:var(--muted);margin-top:.25rem}
.msg-composer{border-top:1px solid var(--border);padding:1rem 1.5rem;display:flex;gap:.75rem}
.msg-composer textarea{flex:1;resize:none;font-size:.85rem}
@media(max-width:800px){.msg-layout{grid-template-columns:1fr}.msg-inbox{max-height:280px}}
</style>
</head>
<body>
<div id="nav-placeholder"></div>
<div class="msg-layout">
  <aside class="msg-inbox" id="msgInbox">
    <div style="padding:1.25rem 1.25rem .75rem"><h2 style="font-family:var(--font-display);font-size:1.2rem;color:var(--cream)">Messages</h2></div>
    <div id="inboxList"><p class="text-muted text-sm" style="padding:0 1.25rem 1.25rem">Loading conversations…</p></div>
  </aside>
  <main class="msg-thread" id="msgThread">
    <div style="flex:1;display:flex;align-items:center;justify-content:center" id="msgEmptyState">
      <p class="text-muted text-sm">Select a conversation to start reading.</p>
    </div>
  </main>
</div>
<script src="../assets/js/nav-inject.js?v=7"></script>
<script src="../assets/js/main.js?v=12"></script>
<script type="module">
import { getSession, getMyConversations, getMessages, sendMessage, markConversationRead } from '../assets/js/supabase.js?v=16';

let conversations = [];
let activeConvoId = null;
let myUserId = null;
let pollTimer = null;

function initials(name=''){
  return name.split(' ').slice(0,2).map(w=>w[0]?.toUpperCase()||'').join('')||'?';
}
const AVATAR_CLASSES = ['av-gold','av-rust','av-sage','av-blue','av-purple'];
function avatarClass(seed=''){
  let h = 0;
  for(let i=0;i<seed.length;i++) h = (h*31 + seed.charCodeAt(i)) >>> 0;
  return AVATAR_CLASSES[h % AVATAR_CLASSES.length];
}
function avatarHtml(p, size){
  const e = escapeHtml;
  const cls = `avatar avatar-${size} ${p && p.avatar_url ? '' : avatarClass(p?.full_name)}`;
  return p && p.avatar_url
    ? `<div class="${cls}"><img src="${e(p.avatar_url)}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%"></div>`
    : `<div class="${cls}">${e(initials(p?.full_name))}</div>`;
}
function timeShort(iso){
  if(!iso) return '';
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diffMs/60000);
  if(mins < 1) return 'now';
  if(mins < 60) return mins+'m';
  const hrs = Math.floor(mins/60);
  if(hrs < 24) return hrs+'h';
  const days = Math.floor(hrs/24);
  if(days < 7) return days+'d';
  return new Date(iso).toLocaleDateString('en-AU',{day:'numeric',month:'short'});
}

function inboxItemHtml(c){
  const e = escapeHtml;
  const name = c.otherParty ? c.otherParty.full_name || 'Member' : '(member removed)';
  const preview = c.lastMessage ? c.lastMessage.body : 'No messages yet — say hello!';
  return `
  <div class="msg-inbox-item ${c.id===activeConvoId?'active':''}" data-convo-id="${e(c.id)}">
    ${avatarHtml(c.otherParty,'md')}
    <div style="flex:1;min-width:0">
      <div class="flex justify-between items-center">
        <div class="text-sm" style="color:var(--cream);font-weight:600">${e(name)}</div>
        <div class="msg-meta">${timeShort(c.lastMessage?.created_at)}</div>
      </div>
      <div class="text-xs text-muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px">${e(preview)}</div>
    </div>
    ${c.unreadCount ? `<span style="background:var(--rust);color:#fff;border-radius:10px;padding:.05rem .5rem;font-size:.62rem;align-self:flex-start">${c.unreadCount}</span>` : ''}
  </div>`;
}

function renderInbox(){
  const wrap = document.getElementById('inboxList');
  wrap.innerHTML = conversations.length
    ? conversations.map(inboxItemHtml).join('')
    : '<p class="text-muted text-sm" style="padding:0 1.25rem 1.25rem">No conversations yet. Message a member from their profile to start one — this is a paid membership perk.</p>';
}

async function loadInbox(){
  try{
    conversations = await getMyConversations();
    renderInbox();
  }catch(err){
    document.getElementById('inboxList').innerHTML = `<p class="text-muted text-sm" style="padding:0 1.25rem">Failed to load conversations: ${err.message}</p>`;
  }
}

function bubbleHtml(m){
  const mine = m.sender_id === myUserId;
  const e = escapeHtml;
  const when = new Date(m.created_at).toLocaleString('en-AU',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
  return `<div class="msg-bubble ${mine?'mine':'theirs'}">${e(m.body)}<div class="msg-meta" style="color:${mine?'rgba(26,19,5,.6)':'var(--muted)'}">${when}</div></div>`;
}

async function openConversation(convoId){
  activeConvoId = convoId;
  renderInbox();
  const convo = conversations.find(c => c.id === convoId);
  const thread = document.getElementById('msgThread');
  const name = convo?.otherParty ? escapeHtml(convo.otherParty.full_name || 'Member') : '(member removed)';
  thread.innerHTML = `
    <div class="msg-thread-header">
      ${avatarHtml(convo?.otherParty,'sm')}
      <div>
        <div class="text-sm" style="color:var(--cream);font-weight:600">${name}</div>
        <div class="text-xs text-muted">${convo?.otherParty ? escapeHtml(convo.otherParty.role||'') : ''}</div>
      </div>
      ${convo?.otherParty ? `<a href="profile.html?id=${escapeHtml(convo.otherParty.id)}" class="text-xs text-gold" style="margin-left:auto;text-decoration:none">View Profile →</a>` : ''}
    </div>
    <div class="msg-thread-body" id="threadBody"><p class="text-muted text-sm">Loading messages…</p></div>
    <div class="msg-composer">
      <textarea id="composerInput" rows="1" placeholder="Write a message…" maxlength="4000"></textarea>
      <button class="btn-primary" id="composerSendBtn" style="font-size:.75rem;padding:.6rem 1.25rem">Send</button>
    </div>`;

  document.getElementById('composerSendBtn').addEventListener('click', sendCurrentMessage);
  document.getElementById('composerInput').addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendCurrentMessage(); }
  });

  await loadThreadMessages(convoId);
  markConversationRead(convoId).then(() => {
    const c = conversations.find(x => x.id === convoId);
    if(c) c.unreadCount = 0;
    renderInbox();
  }).catch(()=>{});

  // Update the URL so this thread is directly linkable/shareable via back button.
  const url = new URL(window.location.href);
  url.searchParams.set('c', convoId);
  window.history.replaceState({}, '', url);
}

async function loadThreadMessages(convoId){
  const body = document.getElementById('threadBody');
  if(!body) return;
  try{
    const messages = await getMessages(convoId);
    body.innerHTML = messages.length ? messages.map(bubbleHtml).join('') : '<p class="text-muted text-sm">No messages yet — say hello!</p>';
    body.scrollTop = body.scrollHeight;
  }catch(err){
    body.innerHTML = `<p class="text-muted text-sm">Failed to load messages: ${err.message}</p>`;
  }
}

async function sendCurrentMessage(){
  const input = document.getElementById('composerInput');
  const btn = document.getElementById('composerSendBtn');
  const body = input.value.trim();
  if(!body || !activeConvoId) return;
  btn.disabled = true;
  try{
    await sendMessage(activeConvoId, body);
    input.value = '';
    await loadThreadMessages(activeConvoId);
    await loadInbox();
  }catch(err){
    showToast(err.message || 'Failed to send message.','danger');
  }finally{
    btn.disabled = false;
  }
}

document.getElementById('inboxList').addEventListener('click', (e) => {
  const row = e.target.closest('[data-convo-id]');
  if(row) openConversation(row.dataset.convoId);
});

window.onReady(async () => {
  const user = Auth.get();
  if(!user){ window.location.href = 'login.html'; return; }
  const session = await getSession();
  myUserId = session ? session.user.id : null;

  await loadInbox();

  const requestedConvo = new URLSearchParams(window.location.search).get('c');
  if(requestedConvo){
    openConversation(requestedConvo);
  }

  // Light polling so an open conversation picks up replies without a full refresh.
  pollTimer = setInterval(() => {
    if(activeConvoId) loadThreadMessages(activeConvoId);
    loadInbox();
  }, 15000);
});
</script>
</body>
</html>
