# Oz Indie Collective — GitHub Pages Configuration
# Deploy: push to main branch, enable GitHub Pages in repo settings

title: "Oz Indie Collective"
description: "Australia's Independent Creative Community — connecting artists, musicians, engineers, managers and creative professionals."
url: "https://yourusername.github.io"
baseurl: "/oz-indie-collective"

# Build settings
theme: null
plugins: []

# Exclude from build
# SECURITY (2026-08): supabase/ and scripts/ were NOT excluded here, which
# means Jekyll was copying them straight into _site — the full DB schema
# (every RLS policy, admin function definitions, plan/pricing logic) and the
# edge function source were being served publicly at
# ozindiecollective.com.au/supabase/schema.sql and /supabase/functions/*.
# This is a stopgap for GitHub Pages while it's still live; the Cloudflare
# migration handles this properly via .assetsignore instead (see wrangler
# config), since backend source shouldn't be inside the deployed directory
# at all long-term.
exclude:
  - README.md
  - "*.sh"
  - "*.py"
  - node_modules/
  - supabase/
  - scripts/

# Include 404 page
include:
  - 404.html

# Defaults
defaults:
  - scope:
      path: ""
    values:
      layout: null
